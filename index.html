<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Close Friends - Official Portal</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Prompt & Kanit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind Custom Configuration -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            pink: '#FF007A',
                            purple: '#8A2BE2',
                            cyan: '#00F0FF',
                            dark: '#0D0B14',
                            card: '#161224'
                        }
                    },
                    fontFamily: {
                        prompt: ['Prompt', 'sans-serif'],
                        kanit: ['Kanit', 'sans-serif']
                    },
                    animation: {
                        'pulse-glow': 'pulseGlow 2.5s infinite alternate',
                        'float': 'float 4s ease-in-out infinite'
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%': { boxShadow: '0 0 15px rgba(255, 0, 122, 0.4), 0 0 30px rgba(138, 43, 226, 0.2)' },
                            '100%': { boxShadow: '0 0 25px rgba(255, 0, 122, 0.8), 0 0 50px rgba(0, 240, 255, 0.5)' }
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-8px)' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #08060c;
            color: #ffffff;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        /* Ambient Lighting Background */
        .ambient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .ambient-orb-1 {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(255,0,122,0.25) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            filter: blur(50px);
        }

        .ambient-orb-2 {
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 80vw;
            height: 80vw;
            background: radial-gradient(circle, rgba(138,43,226,0.25) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            filter: blur(60px);
        }

        .ambient-orb-3 {
            position: absolute;
            top: 40%;
            left: 20%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(0,240,255,0.15) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            filter: blur(50px);
        }

        /* Glassmorphism Styles */
        .glass-card {
            background: rgba(22, 18, 36, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Glowing text effects */
        .neon-text-pink {
            text-shadow: 0 0 10px rgba(255,0,122,0.6), 0 0 20px rgba(255,0,122,0.3);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between items-center px-4 py-8 relative overflow-x-hidden selection:bg-brand-pink selection:text-white">

    <!-- Ambient Glow Background -->
    <div class="ambient-bg">
        <div class="ambient-orb-1"></div>
        <div class="ambient-orb-2"></div>
        <div class="ambient-orb-3"></div>
    </div>

    <div class="w-full max-w-md mx-auto flex flex-col items-center z-10 space-y-8 my-auto">

        <!-- Header / Logo Area -->
        <header class="text-center w-full flex flex-col items-center">
            <!-- Table / Customer Info Badge -->
            <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full glass-card border border-brand-pink/30 mb-5 animate-float">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
                <span class="text-xs font-light text-gray-300">ยินดีต้อนรับ • <span class="font-medium text-white">โต๊ะ 08</span></span>
            </div>

            <!-- Brand Logo Frame -->
            <div class="relative mb-4 group">
                <div class="absolute -inset-1 bg-gradient-to-r from-brand-pink via-brand-purple to-brand-cyan rounded-full blur opacity-75 group-hover:opacity-100 transition duration-1000 group-hover:duration-200 animate-pulse-glow"></div>
                <div class="relative w-28 h-28 rounded-full glass-card flex items-center justify-center p-1 border-2 border-white/20">
                    <!-- Logo Icon -->
                    <div class="w-full h-full rounded-full bg-gradient-to-tr from-brand-dark via-purple-950 to-brand-card flex flex-col items-center justify-center text-white overflow-hidden">
                        <i class="fa-solid font-bold text-4xl fa-glass-cheers text-transparent bg-clip-text bg-gradient-to-r from-brand-pink to-brand-cyan"></i>
                        <span class="text-[10px] tracking-widest font-kanit font-semibold text-brand-cyan mt-1">BAR & BISTRO</span>
                    </div>
                </div>
            </div>

            <!-- Restaurant Name -->
            <h1 class="text-3xl font-extrabold tracking-wider font-kanit text-white neon-text-pink">
                CLOSE FRIENDS
            </h1>
            <p class="text-xs text-gray-400 font-light mt-1.5 tracking-widest uppercase">
                Eat • Drink • Share Memories
            </p>
        </header>

        <main class="w-full space-y-5">

            <!-- Link 1: Food & Beverage Menu External Link -->
            <a href="https://example.com/menu" target="_blank" rel="noopener noreferrer" class="block w-full group relative overflow-hidden rounded-2xl glass-card border border-brand-pink/40 p-5 transition-all duration-300 active:scale-95 hover:border-brand-pink focus:outline-none shadow-lg shadow-brand-pink/10">
                <div class="absolute inset-0 bg-gradient-to-r from-brand-pink/20 via-transparent to-transparent opacity-60 group-hover:opacity-100 transition-opacity"></div>
                
                <div class="relative flex items-center justify-between z-10">
                    <div class="flex items-center space-x-4">
                        <!-- Icon Circle -->
                        <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-brand-pink to-purple-600 flex items-center justify-center shadow-lg shadow-brand-pink/30 group-hover:scale-105 transition-transform shrink-0">
                            <i class="fa-solid fa-utensils text-2xl text-white"></i>
                        </div>
                        <!-- Text Content -->
                        <div class="text-left">
                            <span class="block text-lg font-semibold font-kanit text-white group-hover:text-brand-pink transition-colors">
                                เมนูอาหาร & เครื่องดื่ม
                            </span>
                            <span class="block text-xs text-gray-400 font-light mt-0.5">
                                คลิกเพื่อเปิดดูเมนูรายการอาหาร
                            </span>
                        </div>
                    </div>
                    <!-- Arrow Icon -->
                    <div class="w-9 h-9 rounded-full bg-white/5 flex items-center justify-center text-gray-300 group-hover:text-white group-hover:bg-brand-pink/30 transition-all shrink-0 ml-2">
                        <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                    </div>
                </div>
            </a>

            <!-- Link 2: Photo Screen Upload External Link -->
            <a href="https://example.com/upload-photo" target="_blank" rel="noopener noreferrer" class="block w-full group relative overflow-hidden rounded-2xl glass-card border border-brand-cyan/40 p-5 transition-all duration-300 active:scale-95 hover:border-brand-cyan focus:outline-none shadow-lg shadow-brand-cyan/10">
                <div class="absolute inset-0 bg-gradient-to-r from-brand-cyan/20 via-transparent to-transparent opacity-60 group-hover:opacity-100 transition-opacity"></div>
                
                <div class="relative flex items-center justify-between z-10">
                    <div class="flex items-center space-x-4">
                        <!-- Icon Circle -->
                        <div class="w-14 h-14 rounded-xl bg-gradient-to-br from-brand-cyan via-teal-500 to-emerald-500 flex items-center justify-center shadow-lg shadow-brand-cyan/30 group-hover:scale-105 transition-transform shrink-0">
                            <i class="fa-solid fa-camera-retro text-2xl text-slate-900"></i>
                        </div>
                        <!-- Text Content -->
                        <div class="text-left">
                            <div class="flex items-center gap-1.5">
                                <span class="text-lg font-semibold font-kanit text-white group-hover:text-brand-cyan transition-colors">
                                    ส่งรูปขึ้นจอ / ขอเพลง
                                </span>
                                <span class="flex h-2 w-2 relative">
                                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-cyan opacity-75"></span>
                                  <span class="relative inline-flex rounded-full h-2 w-2 bg-brand-cyan"></span>
                                </span>
                            </div>
                            <span class="block text-xs text-gray-400 font-light mt-0.5">
                                แชร์รูปภาพของคุณขึ้นจอใหญ่ในร้าน
                            </span>
                        </div>
                    </div>
                    <!-- Arrow Icon -->
                    <div class="w-9 h-9 rounded-full bg-white/5 flex items-center justify-center text-gray-300 group-hover:text-white group-hover:bg-brand-cyan/30 transition-all shrink-0 ml-2">
                        <i class="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                    </div>
                </div>
            </a>

        </main>

        <!-- Footer / Social Media Links -->
        <footer class="w-full pt-6 pb-2 text-center space-y-4">
            <p class="text-xs text-gray-400 font-light">ติดตามข่าวสาร & โปรโมชั่น</p>
            
            <div class="flex items-center justify-center space-x-6">
                <!-- Line Official Link -->
                <a href="https://line.me/R/ti/p/@closefriends" target="_blank" rel="noopener noreferrer" aria-label="LINE Official Account" class="w-12 h-12 rounded-full glass-card flex items-center justify-center text-emerald-400 hover:bg-emerald-500 hover:text-white transition-all transform hover:scale-110 active:scale-95 shadow-md">
                    <i class="fa-brands fa-line text-2xl"></i>
                </a>
                
                <!-- Facebook Page Link -->
                <a href="https://www.facebook.com" target="_blank" rel="noopener noreferrer" aria-label="Facebook Page" class="w-12 h-12 rounded-full glass-card flex items-center justify-center text-blue-400 hover:bg-blue-600 hover:text-white transition-all transform hover:scale-110 active:scale-95 shadow-md">
                    <i class="fa-brands fa-facebook-f text-xl"></i>
                </a>
                
                <!-- Instagram Link -->
                <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Instagram Profile" class="w-12 h-12 rounded-full glass-card flex items-center justify-center text-pink-400 hover:bg-gradient-to-tr hover:from-amber-500 hover:via-pink-500 hover:to-purple-600 hover:text-white transition-all transform hover:scale-110 active:scale-95 shadow-md">
                    <i class="fa-brands fa-instagram text-2xl"></i>
                </a>
            </div>

            <p class="text-[11px] text-gray-500 font-light pt-2">
                © 2026 Close Friends Bar & Bistro. All rights reserved.
            </p>
        </footer>

    </div>

</body>
</html>
